[Main]

;If set to 1, changes book names to show progress of how many pages you've read. 
;E.G, "The Book of the Dragonborn | (5 / 19)"
;If this is true and you don't see a count in a book name, it means you haven't opened the book with this plugin installed yet.
;Set to 1 to enable or 0 to disable.
bShowProgress=1

;If set to 1, dims the has been read 'eye' icon in the inventory or item menus until a book has been fully read, 
;E.g you've opened the last page of the book. This feature requires SkyUi.
;Set to 1 to enable or 0 to disable.
bShowIcon=1

[LOG]
;TRACE 0
;DEBUG 1
;INFO 2
;WARN 3
;ERROR 4
;CRITICAL 5
;OFF 6
;Set the minimum log level that can printed to My Games\Skyrim Special Edition\SKSE\SSEBookmarks.log
;Set to 0 (trace) for all logs to be printed.
iMinLevel=3

;These settings are set when first loading skyrim SKSE from desktop,
;Quit to desktop then open skyrim SKSE again to have changes take effect.